[project]
name = "queue"
version = "0.1.0"
requires-python = "==3.13.11"
dependencies = [
    "confluent-kafka[protobuf,schemaregistry]",
    "fastapi[standard]",
    "PyJWT",
    "tritonclient[all]",
    "numpy",
    "redis[hiredis]",
    "opencv-python-headless",
]

[build-system]
requires = ["setuptools>=70.0.0,<=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"