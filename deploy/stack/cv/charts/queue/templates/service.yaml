apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-service
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-broker
  ports:
    - name: internal
      protocol: TCP
      port: 9092
      targetPort: 9092
  {{- if eq .Values.environment "test" }}
    - name: external
      protocol: TCP
      port: 9094
      targetPort: 9094
  {{- end }}
    # - name: controller
    #   port: 9093
    #   targetPort: 9093