apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ .Release.Name }}-{{ .Chart.Name }}-service
  selector:
    matchLabels:
      app: {{ .Release.Name }}-broker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-broker
    spec:
      containers:
        - name: kafka-container
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.containerPort }}
            - containerPort: {{ .Values.ports.controllerPort }}
          {{- if eq .Values.environment "test" }}
            - containerPort: {{ .Values.ports.externalPort }}
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.cpuLimit | quote }}
              memory: {{ .Values.resources.memoryLimit | quote }}
              ephemeral-storage: {{.Values.resources.storageLimit | quote }}
            requests:
              cpu: {{ .Values.resources.cpuRequest | quote }}
              memory: {{ .Values.resources.memoryRequest | quote }}
              ephemeral-storage: {{.Values.resources.storageLimit | quote }}
          env:
            # - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
            #   value: "10000"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              {{- if eq .Values.environment "production" }}
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
              {{- else }}
              value: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
              {{- end }}
            - name: KAFKA_ADVERTISED_LISTENERS
              {{- if eq .Values.environment "production" }}
              value: "PLAINTEXT://{{ .Release.Name }}-{{ .Chart.Name }}-service.{{ .Release.Namespace }}.svc.cluster.local:9092"
              {{- else }}
              value: "PLAINTEXT://{{ .Release.Name }}-{{ .Chart.Name }}-service.{{ .Release.Namespace }}.svc.cluster.local:9092,EXTERNAL://localhost:9094"
              {{- end }}
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              {{- if eq .Values.environment "production" }}
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
              {{- else }}
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
              {{- end }}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
              # value: "1@{{ .Release.Name }}-service:9093"
            - name: KAFKA_QUORUM_VOTERS
              value: "1@localhost:9093"
              # value: "1@{{ .Release.Name }}-service:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_LOG_CLEANER_THREADS
              value: "1"
            - name: KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "16777216"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "104857600"
            - name: KAFKA_NUM_NETWORK_THREADS
              value: "1"
            - name: KAFKA_NUM_IO_THREADS
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kafka-logs"
            # - name: KAFKA_INITIAL_BROKER_REGISTRATION_TIMEOUT_MS
            #   value: "60000"
            - name: KAFKA_CLUSTER_ID
              value: {{ .Values.kafka.kafkaClusterId | quote }}
            # - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
            #   value: "false"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
          lifecycle:
            postStart:
              exec:
                command:
                - /bin/sh
                - -c
                - "(/usr/local/bin/init-topics.sh) &"

          volumeMounts:
          - name: init-script-volume
            mountPath: /usr/local/bin/init-topics.sh
            subPath: init-topics.sh

      volumes:
      - name: init-script-volume
        configMap:
          name: {{ .Release.Name }}-{{ .Chart.Name }}-kafka-init-cm
          defaultMode: 0755
